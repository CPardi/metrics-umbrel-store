name: Update umbrel-app.yml metadata version

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  update-umbrel-app:
    if: success() && (github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: CPardi/update-umbrel-app-action@v0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fallback_service_name: web
